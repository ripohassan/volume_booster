name: untitled
description: "Volume Booster App - Flutter project."
publish_to: 'none' # private package

version: 1.0.9+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons
  cupertino_icons: ^1.0.8

  # Audio and file handling
  audioplayers: ^6.5.1
  file_picker: ^10.3.3

  # Ads
  google_mobile_ads: ^6.0.0
  applovin_max: ^4.6.0

  # Utilities
  shared_preferences: ^2.5.3
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  url_launcher: ^6.3.1
  device_preview: ^1.3.1
  package_info_plus: ^8.0.0

#new feature
  flutter_soloud: ^3.4.9
  app_tracking_transparency: ^2.0.4
  provider: ^6.1.2





  # Icon and splash generation
  flutter_launcher_icons: ^0.14.4
  share_plus: ^10.1.2

  # purchases
  in_app_purchase:





dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter_icons:
  android: true
  ios: true
  image_path: assets/images/Volumix-png.png
  adaptive_icon_foreground: assets/images/Volumix-png.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
